# Local Midnight devnet for the Supply Chain Tracker.
# LOCAL DEVELOPMENT ONLY — do not expose these ports to a public network.
# Tear down with: docker compose down -v
name: supply-chain-tracker-devnet

services:
  node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: supply-chain-node
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    # Healthy means "producing blocks", not just "HTTP up": the probe asks for
    # the hash of block 1 and fails until it exists. The indexer's SPO
    # component exits 1 if it connects while the chain is still at genesis, so
    # the indexer must not start until block 1 exists (depends_on below).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Content-Type: application/json' -d '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getBlockHash\",\"params\":[1]}' http://localhost:9944 | grep -q '\"result\":\"0x'",
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s

  indexer:
    # indexer-standalone 4.3.x ships an SPO indexer whose config hard-requires
    # a Blockfrost API key at boot — the process exits 1 without
    # APP__INFRA__SPO_NODE__BLOCKFROST_ID. A dummy value satisfies the config
    # loader on a local devnet (same as the upstream example-hello-world).
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: supply-chain-indexer
    restart: on-failure
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "local-devnet-dummy-id"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    # Pinned to 8.1.0 (matches the ledger-v8 8.1.0 pinned by Midnight.js 4.1.1).
    # The image is distroless; the healthcheck uses a shell-builtin probe.
    image: midnightntwrk/proof-server:8.1.0
    container_name: supply-chain-proof-server
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6300"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
